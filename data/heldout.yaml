- id: h01_clean
  title: "Term plan - clean call"
  scenario: term_sales          # or loan_sales, or collections
  product: term_shield          # or quickcash_loan (collections also uses quickcash_loan)
  time: "11:30"                 # call time, 24-hour, in quotes
  turns:
    - "B: Namaste! Main Nirmaan Life ki taraf se Aarohi bol rahi hoon, ek AI voice assistant. Kya meri baat Rahul ji se ho  rhi hai?"
    - "C: Haan, boliye kya kaam hai."
    - "B: Rahul ji, aapne hamare website par term insurance ke baare mein enquiry ki thi. Kya aapke pqaas 2 minute hai baat karne ke liye?"
    - "C: Haan I am free right now. Ye Plan ke kya details hain? Kitna premium lagega?"
    - "B: Dekhiye for example agar koi insaan 30 years ka hai & nonsmoker hai to 50 lakhs ka cover lagbagh 550 rupiye per month se shuru hota hai. But Actual premium aapke age, health and smoking pe depend karta hai."
    - "C: Accha, and agar sab thik raha and kuch nhi hua toh? Kya paise wapis milenge?"
    - "B: Nahi, ye actually ek term plan hai, isliye iske maturity pe koi money wapis nhi milta. Ye ek protection plan hai, matlab agar policy term ke dauran insured ki death ho jaati hai toh nominee ko sum assured milta hai. Ye koi savings ya investment plan nahi hai."
    - "C: Achha. Toh ye Claim kitne settle hote hain?"
    - "B: FY 2025-26 mein hamara claim settlement ratio 97.8 percent tha. Lekin ye future ke liye guarantee nahi hai."
    - "C: Theek hai, ek advisor se baat karwa dijiye."
    - "B: Zaroor. Main kal subah 11:30 baje advisor ke saath callback schedule kar deti hoon. Samay dene ke liye Dhanyavaad! Aapka din accha jaye"
  labels: []                 


- id: h02_clean
  title: "Loan sales - clean call"
  scenario: loan_sales
  product: quickcash_loan
  time: "10:45"
  turns:
    - "B: Namaste! Main Udaan Finserv ki taraf se Kavya bol rahi hoon, ek AI assistant. Kya meri baat Sarita Ji se ho rhi hai?"
    - "C: Yes yes."
    - "B: Sarita ji, aapne personal loan ke liye enquiry ki thi. Kya aap 2 minute baat kar sakti hain?"
    - "C: Haan mai free hoon. Accha Kitne tak ka loan milega aur byaj kitna dena hoga?"
    - "B: Hamare QuickCash loan mein 50 hazaar se 10 lakh rupaye tak ka loan mil payega. Byaj/interest 13 se 24 percent saalana hai, aur aapko kitna rate milega ye aapki credit profile par depend karta hai."
    - "C: Okayy aur Processing fee kitni lagti hai?"
    - "B: Processing fee loan amount ka 2 percent plus GST hai, jo disbursal ke time kaat lii jaati hai."
    - "C: Approval pakka hai na?"
    - "B: Approval aapki credit assessment aur document verification par depend karti hai, isliye main approval ki guarantee to nahi dey sakti. Approval ke baad 24 se 48 ghante mein disbursal ho jata hai."
    - "C: Theek hai, mai ready hoon apply karne ke liye."
    - "B: Ji Zaroor. Main pakka aapko Aadhaar, PAN, 3 mahine ki bank statement aur income proof ki list WhatsApp par bhejti hoon."
  labels: []

